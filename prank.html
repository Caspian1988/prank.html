<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kritik Sistem Güncellemesi</title>
  <style>
    body {
      background-color: #000;
      color: #ff3333;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      border: 4px solid #222;
      border-top: 4px solid #ff3333;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 { font-size: 1.4rem; margin-bottom: 10px; }
    p { color: #888; font-size: 0.9rem; }
    .reveal {
      display: none;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div id="prank-screen">
    <div class="spinner"></div>
    <h1>ÖNEMLİ SİSTEM HATASI!</h1>
    <p>Telefon hafızası siliniyor... Lütfen ekranı kapatmayın.</p>
    <p style="color: #ff3333; font-weight: bold;">Kapanışa kalan süre: <span id="timer">5</span>s</p>
  </div>

  <div id="reveal-screen" class="reveal">
    <h1 style="font-size: 2rem; color: #4ade80;">Şaka yaptım kardeşim! 😂</h1>
    <p style="color: #fff; font-size: 1.1rem;">Telefonun gayet sağlam. Selamlar Raminden!</p>
  </div>

  <script>
    let timeLeft = 5;
    const timerElem = document.getElementById('timer');
    
    const interval = setInterval(() => {
      timeLeft--;
      timerElem.innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(interval);
        document.getElementById('prank-screen').style.display = 'none';
        document.getElementById('reveal-screen').style.display = 'block';
        // Try triggering a harmless vibration on mobile browsers if supported
        if ("vibrate" in navigator) {
          navigator.vibrate([200, 100, 200]);
        }
      }
    }, 1000);
  </script>

</body>
</html>
